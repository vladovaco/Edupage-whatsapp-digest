# Spustenie digestu priamo z GitHubu – bez vlastného servera.
#
# 1. V repozitári nastav Settings → Secrets and variables → Actions → New repository secret:
#    EDUPAGE_USERNAME, EDUPAGE_PASSWORD, EDUPAGE_SUBDOMAIN,
#    WHATSAPP_TOKEN, WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_RECIPIENT
#    ANTHROPIC_API_KEY, ELEVENLABS_API_KEY
#    (voliteľne EDUPAGE_CHILD_ID, ELEVENLABS_VOICE_ID)
# 2. Digest spustíš v záložke Actions → „Edupage digest" → Run workflow
#    – funguje aj z mobilnej appky GitHub, takže hlasovku si vyžiadaš z telefónu.
#
# Automaticky beží každý pracovný deň o 17:05 bratislavského času.
# GitHub cron pozná len UTC, preto sú tu dva crony (letný a zimný čas) a job
# „check-time“ podľa aktuálneho časového pásma ten nesprávny preskočí.
# Minúta 5 je zámerne: behy presne o celej hodine GitHub pri vyťažení
# často odkladá alebo úplne vynechá.
#
# GitHub runnery občas nemajú spojenie na Edupage (Network is unreachable).
# Samotný pokus je v _digest-attempt.yml a pri sieťovej chybe sa zopakuje
# až trikrát, vždy na novom runneri.

name: Edupage digest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Koľko dní dozadu (prázdne = od posledného behu)"
        required: false
        default: ""
  schedule:
    - cron: "5 15 * * 1-5"   # 17:05 SELČ (letný čas)
    - cron: "5 16 * * 1-5"   # 17:05 SEČ (zimný čas)

jobs:
  check-time:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Ktorý cron beh spustil, a či je v Bratislave práve letný čas (CEST)
          cron="${{ github.event.schedule }}"
          zone=$(TZ=Europe/Bratislava date +%Z)
          case "$cron $zone" in
            "5 15 * * 1-5 CEST"|"5 16 * * 1-5 CET")
              echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Cron '$cron' nepatrí k pásmu $zone – tento beh preskakujem."
              echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

  attempt-1:
    needs: check-time
    if: needs.check-time.outputs.run == 'true'
    uses: ./.github/workflows/_digest-attempt.yml
    with:
      days: ${{ inputs.days || '' }}
    secrets: inherit

  attempt-2:
    needs: attempt-1
    if: needs.attempt-1.outputs.network_error == 'true'
    uses: ./.github/workflows/_digest-attempt.yml
    with:
      days: ${{ inputs.days || '' }}
    secrets: inherit

  attempt-3:
    needs: attempt-2
    if: needs.attempt-2.outputs.network_error == 'true'
    uses: ./.github/workflows/_digest-attempt.yml
    with:
      days: ${{ inputs.days || '' }}
    secrets: inherit

  # Ak ani tretí pokus neprešiel cez sieť, označ workflow ako zlyhaný.
  result:
    needs: attempt-3
    if: needs.attempt-3.outputs.network_error == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Edupage bolo nedostupné pri všetkých troch pokusoch."
          exit 1
